[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "semantic-change-explorer"
version = "1.0.0"
description = "Local spatial understanding of structured scene changes"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
[project.scripts]
sce = "semantic_change_explorer.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
semantic_change_explorer = ["viewer/**/*", "viewer/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
